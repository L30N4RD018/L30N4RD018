name: Profile assets

# Genera las imagenes del perfil (stats, top languages y snake de contribuciones)
# y las publica en la rama `output`. Nada de esto se commitea en `main`: la rama
# `output` existe solo para artefactos generados, y se reescribe en cada corrida.
#
# Nota sobre el cron: GitHub desactiva los workflows programados de un repo
# publico tras 60 dias sin actividad, y al hacerlo desactiva tambien sus otros
# triggers. El push diario a `output` cuenta como actividad y mantiene esto vivo.
# Si aun asi llega a desactivarse, se reactiva en Actions -> Profile assets ->
# Enable workflow.

on:
  schedule:
    # Diario a las 04:17 UTC. Minuto no-cero a proposito: los jobs agendados a
    # la hora en punto compiten con medio GitHub y se retrasan mucho mas.
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

# Las corridas se serializan para que dos push simultaneos no se pisen al
# reescribir `output`. Sin cancel-in-progress: cancelar una corrida a medias no
# aporta nada en un job diario y hace que una re-ejecucion manual parezca
# colgada mientras espera el turno.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=0969da&icon_color=0969da&text_color=1f2328
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=2f81f7&icon_color=2f81f7&text_color=e6edf3
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=0969da&text_color=1f2328
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=2f81f7&text_color=e6edf3
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # Se publica solo si todos los pasos anteriores produjeron su SVG. Si la
      # generacion falla (rate limit, API caida), el job aborta aqui y la rama
      # `output` conserva las imagenes de ayer en vez de quedar rota.
      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update profile assets"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
