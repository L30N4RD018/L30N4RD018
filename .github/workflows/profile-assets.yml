name: Profile assets

# Genera las imagenes del perfil (stats, top languages, activity graph y snake
# de contribuciones) y las publica en la rama `output`. Nada de esto se commitea en `main`: la rama
# `output` existe solo para artefactos generados, y se reescribe en cada corrida.
#
# Nota sobre el cron: GitHub desactiva los workflows programados de un repo
# publico tras 60 dias sin actividad, y al hacerlo desactiva tambien sus otros
# triggers. El push diario a `output` cuenta como actividad y mantiene esto vivo.
# Si aun asi llega a desactivarse, se reactiva en Actions -> Profile assets ->
# Enable workflow.

on:
  schedule:
    # Diario a las 04:17 UTC. Minuto no-cero a proposito: los jobs agendados a
    # la hora en punto compiten con medio GitHub y se retrasan mucho mas.
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

# Las corridas se serializan para que dos push simultaneos no se pisen al
# reescribir `output`. Sin cancel-in-progress: cancelar una corrida a medias no
# aporta nada en un job diario y hace que una re-ejecucion manual parezca
# colgada mientras espera el turno.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=0969da&icon_color=0969da&text_color=1f2328
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=2f81f7&icon_color=2f81f7&text_color=e6edf3
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=0969da&text_color=1f2328
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=2f81f7&text_color=e6edf3
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # El activity graph se genera aca y se publica en `output`, en vez de
      # enlazarse desde el README. Ese siempre fue el punto: si el README
      # apuntara a un servicio externo, cada visita al perfil dependeria de que
      # ese servicio este arriba.
      #
      # Y efectivamente se cayo. Hasta ahora esto bajaba el SVG de
      # github-readme-activity-graph.vercel.app, que quedo deshabilitado de
      # forma permanente: devuelve HTTP 402 con x-vercel-error
      # DEPLOYMENT_DISABLED. Los reintentos no ayudaban porque los tres
      # recibian el mismo 402, y --fail cortaba el paso.
      #
      # Ahora el script consulta el contributionCalendar por la GraphQL de
      # GitHub y dibuja el SVG con la stdlib de Python, asi que este paso no
      # depende de ningun tercero. Los colores van por flag para que las dos
      # variantes cierren con el resto de las tarjetas.
      #
      # Si GITHUB_TOKEN alguna vez no alcanzara para leer el calendario, se
      # carga un PAT como secret ACTIVITY_GRAPH_TOKEN y el fallback de abajo lo
      # toma sin tocar nada mas.
      - name: Contribution activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_GRAPH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 .github/scripts/activity-graph.py \
            --username "${{ github.repository_owner }}" --days 30 \
            --title-color 0969da --axis-color 57606a \
            --line-color 0969da --area-color 0969da \
            --output dist/activity.svg
          python3 .github/scripts/activity-graph.py \
            --username "${{ github.repository_owner }}" --days 30 \
            --title-color 2f81f7 --axis-color 8b949e \
            --line-color 2f81f7 --area-color 2f81f7 \
            --output dist/activity-dark.svg

      # Un SVG vacio o truncado pasaria el `git commit` sin quejarse y romperia
      # el README en silencio. Se valida que cada archivo exista, tenga tamano
      # razonable y sea realmente XML antes de publicar.
      - name: Verify generated assets
        run: |
          set -euo pipefail
          expected="stats stats-dark top-langs top-langs-dark snake snake-dark activity activity-dark"
          for name in $expected; do
            f="dist/${name}.svg"
            [ -s "$f" ] || { echo "::error::$f falta o esta vacio"; exit 1; }
            size=$(wc -c < "$f")
            [ "$size" -ge 512 ] || { echo "::error::$f solo tiene ${size} bytes"; exit 1; }
            head -c 512 "$f" | grep -q "<svg" || { echo "::error::$f no parece un SVG"; exit 1; }
            echo "ok  $f (${size} bytes)"
          done

      # Se publica solo si todos los pasos anteriores produjeron su SVG. Si la
      # generacion falla (rate limit, API caida), el job aborta aqui y la rama
      # `output` conserva las imagenes de ayer en vez de quedar rota.
      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update profile assets"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
